<svg viewBox="0 0 400 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>瓷胎竹编茶盘</title>
  <desc>岚 Lan 瓷胎竹编果盘/茶盘概念图</desc>
  <defs>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c9a563"/>
      <rect x="0" y="0" width="7" height="14" fill="#dcc488"/>
      <rect x="0" y="0" width="14" height="7" fill="#b8924f" opacity="0.45"/>
      <rect x="7" y="7" width="7" height="7" fill="#b8924f" opacity="0.45"/>
    </pattern>
  </defs>

  <ellipse cx="200" cy="350" rx="160" ry="40" fill="#000000" opacity="0.10"/>

  <!-- 盘外圈 竹编 -->
  <ellipse cx="200" cy="300" rx="158" ry="64" fill="url(#weave)" stroke="#8f6f38" stroke-width="2"/>
  <!-- 内底 瓷胎 -->
  <ellipse cx="200" cy="294" rx="126" ry="48" fill="#f2ead6" stroke="#d8cdb4" stroke-width="2"/>
  <ellipse cx="200" cy="292" rx="110" ry="40" fill="#fffaf0"/>
  <!-- 盘沿高光 -->
  <path d="M64,290 Q200,250 336,290" stroke="#ffffff" stroke-width="3" opacity="0.3" fill="none"/>
</svg>
