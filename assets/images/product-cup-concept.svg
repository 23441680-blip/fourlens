<svg viewBox="0 0 400 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>瓷胎竹编咖啡杯</title>
  <desc>岚 Lan 竹编大口咖啡杯概念图</desc>
  <defs>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c9a563"/>
      <rect x="0" y="0" width="7" height="14" fill="#dcc488"/>
      <rect x="0" y="0" width="14" height="7" fill="#b8924f" opacity="0.45"/>
      <rect x="7" y="7" width="7" height="7" fill="#b8924f" opacity="0.45"/>
    </pattern>
  </defs>

  <ellipse cx="200" cy="430" rx="105" ry="22" fill="#000000" opacity="0.12"/>

  <!-- 杯身 -->
  <path d="M120,180 L150,400 Q200,422 250,400 L280,180 Z" fill="url(#weave)" stroke="#8f6f38" stroke-width="2"/>
  <path d="M150,400 Q200,422 250,400 L246,414 Q200,436 154,414 Z" fill="#a8854a" stroke="#8f6f38" stroke-width="1"/>
  <!-- 杯口 瓷胎 -->
  <ellipse cx="200" cy="180" rx="80" ry="18" fill="url(#weave)" stroke="#8f6f38" stroke-width="2"/>
  <ellipse cx="200" cy="181" rx="68" ry="14" fill="#f6f1e6" stroke="#d8cdb4" stroke-width="1"/>
  <ellipse cx="200" cy="183" rx="58" ry="11" fill="#e7ddc8"/>
  <!-- 把手 -->
  <path d="M280,216 C346,216 346,330 262,326" fill="none" stroke="#b8924f" stroke-width="16" stroke-linecap="round"/>
  <path d="M280,216 C346,216 346,330 262,326" fill="none" stroke="#dcc488" stroke-width="6" stroke-linecap="round"/>
  <!-- 高光 -->
  <path d="M148,200 Q156,300 152,388" stroke="#ffffff" stroke-width="6" opacity="0.22" fill="none" stroke-linecap="round"/>
</svg>
