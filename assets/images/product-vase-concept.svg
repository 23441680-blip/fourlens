<svg viewBox="0 0 400 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>瓷胎竹编花瓶</title>
  <desc>岚 Lan 瓷胎竹编花器概念图</desc>
  <defs>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c9a563"/>
      <rect x="0" y="0" width="7" height="14" fill="#dcc488"/>
      <rect x="0" y="0" width="14" height="7" fill="#b8924f" opacity="0.45"/>
      <rect x="7" y="7" width="7" height="7" fill="#b8924f" opacity="0.45"/>
    </pattern>
  </defs>

  <ellipse cx="200" cy="450" rx="92" ry="20" fill="#000000" opacity="0.12"/>

  <!-- 瓶身 -->
  <path d="M184,96 L216,96 L223,176 Q286,212 274,322 Q262,424 200,432 Q138,424 126,322 Q114,212 177,176 Z"
        fill="url(#weave)" stroke="#8f6f38" stroke-width="2"/>
  <!-- 高光 -->
  <path d="M158,210 Q150,310 168,400" stroke="#ffffff" stroke-width="6" opacity="0.22" fill="none" stroke-linecap="round"/>

  <!-- 瓶口 瓷胎 -->
  <ellipse cx="200" cy="96" rx="20" ry="7" fill="#f2ead6" stroke="#d8cdb4" stroke-width="1.5"/>
  <ellipse cx="200" cy="94" rx="13" ry="4" fill="#fffaf0"/>

  <!-- 束腰装饰线 -->
  <path d="M150,250 Q200,262 250,250" stroke="#8f6f38" stroke-width="1.5" fill="none" opacity="0.6"/>
</svg>
