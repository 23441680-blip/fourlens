<svg viewBox="0 0 400 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>瓷胎竹编茶叶罐</title>
  <desc>岚 Lan 瓷胎竹编茶叶罐概念图</desc>
  <defs>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c9a563"/>
      <rect x="0" y="0" width="7" height="14" fill="#dcc488"/>
      <rect x="0" y="0" width="14" height="7" fill="#b8924f" opacity="0.45"/>
      <rect x="7" y="7" width="7" height="7" fill="#b8924f" opacity="0.45"/>
    </pattern>
    <linearGradient id="lidShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6cf94"/>
      <stop offset="0.5" stop-color="#c9a563"/>
      <stop offset="1" stop-color="#a8854a"/>
    </linearGradient>
  </defs>

  <ellipse cx="200" cy="452" rx="112" ry="22" fill="#000000" opacity="0.12"/>

  <!-- 罐身 -->
  <path d="M98,158 Q200,128 302,158 L296,402 Q200,432 104,402 Z" fill="url(#weave)" stroke="#8f6f38" stroke-width="2"/>
  <!-- 罐身高光 -->
  <path d="M132,178 Q142,290 137,388" stroke="#ffffff" stroke-width="7" opacity="0.22" fill="none" stroke-linecap="round"/>

  <!-- 罐盖 -->
  <ellipse cx="200" cy="158" rx="104" ry="27" fill="url(#weave)" stroke="#8f6f38" stroke-width="2"/>
  <path d="M112,158 Q200,118 288,158 L280,128 Q200,100 120,128 Z" fill="url(#lidShade)" stroke="#8f6f38" stroke-width="1.5"/>
  <ellipse cx="200" cy="120" rx="80" ry="18" fill="url(#weave)" stroke="#8f6f38" stroke-width="1.5"/>
  <!-- 顶钮 瓷胎 -->
  <ellipse cx="200" cy="104" rx="22" ry="9" fill="#f2ead6" stroke="#d8cdb4" stroke-width="1.5"/>
  <ellipse cx="200" cy="101" rx="14" ry="5" fill="#fffaf0"/>
</svg>
