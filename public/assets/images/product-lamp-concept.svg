<svg viewBox="0 0 400 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>瓷胎竹编灯罩</title>
  <desc>岚 Lan 竹编灯罩/灯具概念图</desc>
  <defs>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c9a563"/>
      <rect x="0" y="0" width="7" height="14" fill="#dcc488"/>
      <rect x="0" y="0" width="14" height="7" fill="#b8924f" opacity="0.45"/>
      <rect x="7" y="7" width="7" height="7" fill="#b8924f" opacity="0.45"/>
    </pattern>
  </defs>

  <ellipse cx="200" cy="446" rx="100" ry="20" fill="#000000" opacity="0.12"/>

  <!-- 灯罩 竹编 半透 -->
  <path d="M138,150 L262,150 L286,402 L114,402 Z" fill="url(#weave)" opacity="0.92" stroke="#8f6f38" stroke-width="2"/>
  <!-- 内部暖光 -->
  <ellipse cx="200" cy="280" rx="46" ry="96" fill="#fff3d0" opacity="0.55"/>
  <ellipse cx="200" cy="290" rx="26" ry="70" fill="#ffe9a8" opacity="0.6"/>
  <!-- 顶盖/底座 木色 -->
  <ellipse cx="200" cy="150" rx="62" ry="14" fill="#8a6d3b" stroke="#6f5630" stroke-width="1.5"/>
  <ellipse cx="200" cy="402" rx="86" ry="18" fill="#8a6d3b" stroke="#6f5630" stroke-width="1.5"/>
  <rect x="186" y="402" width="28" height="30" fill="#6f5630"/>
</svg>
